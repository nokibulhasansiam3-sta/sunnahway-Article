<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Articles Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4F46E5;
            /* Indigo 600 */
            --primary-hover: #4338CA;
            /* Indigo 700 */
            --secondary-color: #EC4899;
            /* Pink 500 */
            --bg-color: #F3F4F6;
            /* Gray 100 */
            --card-bg: #FFFFFF;
            --text-primary: #111827;
            /* Gray 900 */
            --text-secondary: #6B7280;
            /* Gray 500 */
            --border-color: #E5E7EB;
            /* Gray 200 */
            --chat-width: 400px;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
            transition: all 0.3s ease;
            background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Header */
        .main-header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-header h2 {
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            font-size: 1.75rem;
            letter-spacing: -0.025em;
        }

        .main-header small {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            border: none;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3);
        }

        .btn-outline-secondary {
            border-color: var(--border-color);
            color: var(--text-secondary);
            background: white;
        }

        .btn-outline-secondary:hover {
            background: var(--bg-color);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
        }

        .category-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .category-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-card:hover::after {
            opacity: 1;
        }

        .category-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            background: #EEF2FF;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }

        .category-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .category-count {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Article List */
        .article-list-view {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .article-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .article-card:hover {
            transform: translateX(5px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .story-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .story-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        /* Editor View */
        .editor-view {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            background-color: #F9FAFB;
            transition: all 0.2s;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .card {
            border-radius: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .nav-tabs .nav-link {
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 15px 25px;
            border-bottom: 2px solid transparent;
        }

        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: transparent;
        }

        .nav-tabs .nav-link:hover {
            color: var(--primary-color);
            border-color: transparent;
        }

        /* AI Widget Styles */
        .ai-fab {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            z-index: 2000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .ai-fab:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.5);
        }

        .ai-widget {
            position: fixed;
            bottom: 120px;
            right: 40px;
            width: var(--chat-width);
            height: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            z-index: 1999;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ai-widget.open {
            display: flex;
        }

        .chat-messages {
            background-color: #F9FAFB;
        }

        .message {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message.user {
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: white;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid p-0">

        <!-- 1. Category View -->
        <div id="categoryView">
            <div class="main-header">
                <div>
                    <h2><i class="bi bi-grid-fill me-2"></i>Article Categories</h2>
                    <small class="text-muted">Manage your article categories</small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" onclick="openSettings()">
                        <i class="bi bi-gear"></i>
                    </button>
                    <button class="btn btn-primary" onclick="openCategoryModal()">
                        <i class="bi bi-plus-lg me-2"></i>New Category
                    </button>
                </div>
            </div>

            <div id="categoryList" class="category-grid">
                <div class="text-center w-100 py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>

        <!-- 2. Article List View -->
        <div id="articleListView" class="article-list-view">
            <div class="main-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light border rounded-circle p-2" onclick="showCategoryView()">
                        <i class="bi bi-arrow-left fs-5"></i>
                    </button>
                    <div>
                        <h2 id="currentCategoryTitle">Category Name</h2>
                        <small class="text-muted" id="articleCount">0 articles</small>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="createNewArticle()">
                    <i class="bi bi-plus-lg me-2"></i>New Article
                </button>
            </div>

            <div id="articleListContainer">
                <!-- Articles loaded here -->
            </div>
        </div>

        <!-- 3. Editor View -->
        <div id="editorView" class="editor-view">
            <div class="main-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light border rounded-circle p-2" onclick="showArticleListView()">
                        <i class="bi bi-arrow-left fs-5"></i>
                    </button>
                    <div>
                        <h2>Editor</h2>
                        <small class="text-muted">Write your article in 3 languages</small>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button id="deleteBtn" class="btn btn-outline-danger" onclick="deleteArticle()"
                        style="display: none;">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                    <button class="btn btn-success" onclick="publishArticle()">
                        <i class="bi bi-cloud-upload me-2"></i>Save & Publish
                    </button>
                </div>
            </div>

            <input type="hidden" id="articleId">
            <input type="hidden" id="originalCategory">
            <input type="hidden" id="editorCategory">

            <!-- Title Inputs -->
            <div class="card mb-4 border-0 shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Title (Bangla)</label>
                            <input type="text" id="titleBn" class="form-control" placeholder="বাংলা শিরোনাম">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Title (English)</label>
                            <input type="text" id="titleEn" class="form-control" placeholder="English Title">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Title (Arabic)</label>
                            <input type="text" id="titleAr" class="form-control" placeholder="العنوان" dir="rtl">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-light border-bottom-0">
                    <ul class="nav nav-tabs card-header-tabs" id="langTabs" role="tablist">
                        <li class="nav-item"><button class="nav-link active" id="bn-tab" data-bs-toggle="tab"
                                data-bs-target="#bn-content">🇧🇩 Bangla</button></li>
                        <li class="nav-item"><button class="nav-link" id="en-tab" data-bs-toggle="tab"
                                data-bs-target="#en-content">🇺🇸 English</button></li>
                        <li class="nav-item"><button class="nav-link" id="ar-tab" data-bs-toggle="tab"
                                data-bs-target="#ar-content">🇸🇦 Arabic</button></li>
                    </ul>
                </div>
                <div class="card-body p-0">
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="bn-content">
                            <textarea id="contentBn" class="form-control border-0 p-4" rows="20"
                                placeholder="এখানে লিখুন..."></textarea>
                        </div>
                        <div class="tab-pane fade" id="en-content">
                            <textarea id="contentEn" class="form-control border-0 p-4" rows="20"
                                placeholder="Write content here..."></textarea>
                        </div>
                        <div class="tab-pane fade" id="ar-content">
                            <textarea id="contentAr" class="form-control border-0 p-4" rows="20"
                                placeholder="اكتب المحتوى هنا..." dir="rtl"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- AI Floating Button -->
    <button class="ai-fab" onclick="toggleAIWidget()">
        <i class="bi bi-stars"></i>
    </button>

    <!-- AI Widget -->
    <div class="ai-widget" id="aiWidget">
        <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-robot text-primary fs-5"></i>
                <select id="aiModel" class="form-select form-select-sm border-0 bg-transparent fw-bold"
                    style="width: auto;">
                    <option value="gemini-2.0-flash">⚡ Gemini 2.0 Flash</option>
                    <option value="gpt-4o">🤖 GPT-4o</option>
                </select>
            </div>
            <button class="btn-close" onclick="toggleAIWidget()"></button>
        </div>
        <div class="chat-messages" id="chatHistory">
            <div class="message ai">Hello! I can help you write articles.</div>
        </div>
        <div class="p-3 border-top bg-light">
            <div class="input-group">
                <input type="text" id="chatInput" class="form-control" placeholder="Ask AI..."
                    onkeypress="if(event.key==='Enter') sendChat()">
                <button class="btn btn-primary" onclick="sendChat()"><i class="bi bi-send"></i></button>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12"><input type="text" id="newCatId" class="form-control"
                                placeholder="ID (e.g. history)"></div>
                        <div class="col-12"><input type="text" id="newCatBn" class="form-control"
                                placeholder="Bangla Name"></div>
                        <div class="col-12"><input type="text" id="newCatEn" class="form-control"
                                placeholder="English Name"></div>
                        <div class="col-12"><input type="text" id="newCatAr" class="form-control"
                                placeholder="Arabic Name" dir="rtl"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary w-100" onclick="addCategory()">Create Category</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">API Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Gemini API Key</label>
                        <input type="password" id="geminiKey" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">OpenAI API Key</label>
                        <input type="password" id="openaiKey" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveSettings()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        let categories = [];
        let currentCategory = null;
        let currentArticles = [];

        // --- Init ---
        window.onload = async () => {
            await loadCategories();
            loadSettings();
        };

        // --- Navigation ---
        function showCategoryView() {
            document.getElementById('articleListView').style.display = 'none';
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('categoryView').style.display = 'block';
            currentCategory = null;
        }

        function showArticleListView() {
            document.getElementById('categoryView').style.display = 'none';
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('articleListView').classList.add('active');
            document.getElementById('articleListView').style.display = 'block';
        }

        function showEditorView() {
            document.getElementById('categoryView').style.display = 'none';
            document.getElementById('articleListView').style.display = 'none';
            document.getElementById('editorView').classList.add('active');
            document.getElementById('editorView').style.display = 'block';
        }

        // --- Categories ---
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
                displayCategories();
            } catch (e) { console.error(e); }
        }

        function displayCategories() {
            const list = document.getElementById('categoryList');
            if (categories.length === 0) {
                list.innerHTML = '<div class="text-center text-muted w-100 py-5">No categories found.</div>';
                return;
            }

            list.innerHTML = categories.map(cat => `
                <div class="category-card" onclick="loadArticles('${cat.id}', '${cat.titleEn}')">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="category-icon"><i class="bi bi-folder-fill"></i></div>
                            <div class="category-title">${cat.titleEn}</div>
                            <div class="category-count">${cat.titleBn}</div>
                        </div>
                        <div class="dropdown" onclick="event.stopPropagation()">
                            <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="dropdown">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item text-danger" href="#" onclick="deleteCategory('${cat.id}')"><i class="bi bi-trash me-2"></i>Delete</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addCategory() {
            const id = document.getElementById('newCatId').value.trim();
            const titleBn = document.getElementById('newCatBn').value.trim();
            const titleEn = document.getElementById('newCatEn').value.trim();
            const titleAr = document.getElementById('newCatAr').value.trim();

            if (!id || !titleBn || !titleEn) return Swal.fire('Error', 'Fields required', 'error');

            try {
                await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, titleBn, titleEn, titleAr })
                });
                await fetch('/api/push', { method: 'POST' });

                bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                loadCategories();
                Swal.fire('Success', 'Category added', 'success');
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        async function deleteCategory(id) {
            const result = await Swal.fire({
                title: 'Delete Category?',
                text: "This will delete the category and its data file.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it'
            });

            if (result.isConfirmed) {
                try {
                    await fetch('/api/categories/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });
                    await fetch('/api/push', { method: 'POST' });
                    loadCategories();
                    Swal.fire('Deleted', 'Category deleted', 'success');
                } catch (e) { Swal.fire('Error', e.message, 'error'); }
            }
        }

        // --- Articles ---
        async function loadArticles(categoryId, categoryTitle) {
            currentCategory = { id: categoryId, title: categoryTitle };
            document.getElementById('currentCategoryTitle').textContent = categoryTitle;

            showArticleListView();
            document.getElementById('articleListContainer').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

            try {
                const res = await fetch(`/api/articles/${categoryId}`);
                currentArticles = await res.json();
                document.getElementById('articleCount').textContent = `${currentArticles.length} articles`;
                displayArticles();
            } catch (e) { console.error(e); }
        }

        function displayArticles() {
            const container = document.getElementById('articleListContainer');
            if (currentArticles.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted">No articles yet. Create one!</div>';
                return;
            }

            container.innerHTML = currentArticles.map(article => `
                <div class="article-card" onclick='editArticle(${JSON.stringify(article).replace(/'/g, "&apos;")})'>
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="story-title">${article.titleEn || 'No Title'}</h5>
                            <p class="story-summary">${article.titleBn || ''}</p>
                            <small class="text-muted"><i class="bi bi-hash me-1"></i>${article.id}</small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                </div>
            `).join('');
        }

        function createNewArticle() {
            document.getElementById('articleId').value = '';
            document.getElementById('originalCategory').value = '';
            document.getElementById('editorCategory').value = currentCategory.id;

            ['titleBn', 'titleEn', 'titleAr', 'contentBn', 'contentEn', 'contentAr'].forEach(id => document.getElementById(id).value = '');

            document.getElementById('deleteBtn').style.display = 'none';
            showEditorView();
        }

        function editArticle(article) {
            document.getElementById('articleId').value = article.id;
            document.getElementById('originalCategory').value = currentCategory.id;
            document.getElementById('editorCategory').value = currentCategory.id;

            ['titleBn', 'titleEn', 'titleAr', 'contentBn', 'contentEn', 'contentAr'].forEach(id => document.getElementById(id).value = article[id] || '');

            document.getElementById('deleteBtn').style.display = 'block';
            showEditorView();
        }

        async function publishArticle() {
            const categoryId = document.getElementById('editorCategory').value;
            const articleId = document.getElementById('articleId').value || `${categoryId}-${Date.now()}`;

            const article = {
                id: articleId,
                categoryId: categoryId,
                titleBn: document.getElementById('titleBn').value,
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                contentBn: document.getElementById('contentBn').value,
                contentEn: document.getElementById('contentEn').value,
                contentAr: document.getElementById('contentAr').value
            };

            if (!article.titleEn) return Swal.fire('Error', 'English Title is required', 'error');

            try {
                Swal.fire({ title: 'Saving...', didOpen: () => Swal.showLoading() });

                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: categoryId, article })
                });
                await fetch('/api/push', { method: 'POST' });

                Swal.fire('Saved', 'Article saved and pushed to GitHub', 'success');
                loadArticles(categoryId, currentCategory.title);
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        async function deleteArticle() {
            const id = document.getElementById('articleId').value;
            const category = document.getElementById('editorCategory').value;

            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "Delete this article?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it'
            });

            if (result.isConfirmed) {
                try {
                    await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category, id })
                    });
                    await fetch('/api/push', { method: 'POST' });

                    Swal.fire('Deleted', 'Article deleted', 'success');
                    loadArticles(category, currentCategory.title);
                } catch (e) { Swal.fire('Error', e.message, 'error'); }
            }
        }

        // --- Settings & AI ---
        function openSettings() { new bootstrap.Modal(document.getElementById('settingsModal')).show(); }
        function openCategoryModal() { new bootstrap.Modal(document.getElementById('categoryModal')).show(); }
        function toggleAIWidget() { document.getElementById('aiWidget').classList.toggle('open'); }

        function loadSettings() {
            document.getElementById('geminiKey').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('openaiKey').value = localStorage.getItem('openai_api_key') || '';
        }

        function saveSettings() {
            localStorage.setItem('gemini_api_key', document.getElementById('geminiKey').value);
            localStorage.setItem('openai_api_key', document.getElementById('openaiKey').value);
            bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
            Swal.fire('Saved', 'API Keys saved', 'success');
        }

        // Basic AI Chat (Simplified for brevity)
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const history = document.getElementById('chatHistory');
            history.innerHTML += `<div class="message user">${msg}</div>`;
            input.value = '';

            try {
                const response = await callAI(msg);
                history.innerHTML += `<div class="message ai">${response.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                history.innerHTML += `<div class="message ai text-danger">Error: ${e.message}</div>`;
            }
            history.scrollTop = history.scrollHeight;
        }

        async function runAgent() {
            const topic = document.getElementById('agentTopic').value;
            if (!topic) { Swal.fire('Topic Required', 'Please enter a topic first.', 'warning'); return; }

            const status = document.getElementById('agentStatus');
            status.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div> Writing article... This may take a few seconds.';

            const prompt = `You are an expert Islamic scholar. Write a comprehensive article about: "${topic}".
            IMPORTANT: You must return ONLY a valid JSON object. Do not add any markdown formatting like \`\`\`json or \`\`\`.
            The JSON structure must be exactly this:
            {
                "titleBn": "Title in Bangla",
                "titleEn": "Title in English",
                "titleAr": "Title in Arabic",
                "contentBn": "Full content in Bangla (use Markdown for headings, lists, bold)",
                "contentEn": "Full content in English (use Markdown)",
                "contentAr": "Full content in Arabic (use Markdown)"
            }`;

            try {
                console.log('Sending request to AI...');
                let text = await callAI(prompt, true);
                console.log('Raw AI Response:', text);

                // Robust JSON extraction: Find the first '{' and last '}'
                const jsonStart = text.indexOf('{');
                const jsonEnd = text.lastIndexOf('}');

                if (jsonStart === -1 || jsonEnd === -1) {
                    throw new Error('AI did not return valid JSON. Check console for raw output.');
                }

                const jsonStr = text.substring(jsonStart, jsonEnd + 1);
                const result = JSON.parse(jsonStr);

                // Populate fields safely
                if (result.titleBn) document.getElementById('titleBn').value = result.titleBn;
                if (result.titleEn) document.getElementById('titleEn').value = result.titleEn;
                if (result.titleAr) document.getElementById('titleAr').value = result.titleAr;
                if (result.contentBn) document.getElementById('contentBn').value = result.contentBn;
                if (result.contentEn) document.getElementById('contentEn').value = result.contentEn;
                if (result.contentAr) document.getElementById('contentAr').value = result.contentAr;

                status.innerHTML = '<span class="text-success fw-bold"><i class="bi bi-check-circle"></i> Done! Article populated.</span>';

                // Close widget after a short delay
                setTimeout(() => {
                    toggleAIWidget();
                    Swal.fire({
                        icon: 'success',
                        title: 'Article Generated!',
                        text: 'Review the content in the editor.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }, 1000);

            } catch (e) {
                console.error('Agent Error:', e);
                status.innerHTML = `<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> Error: ${e.message}</span>`;
            }
        }
    </script>
</body>
