<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Articles Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-emerald-900 to-gray-900 min-h-screen text-white">

    <!-- Header -->
    <div class="sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button id="backBtn" class="hidden bg-white/10 hover:bg-white/20 p-2 rounded-lg transition"
                        onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-bold text-white" id="pageTitle">Article Categories</h1>
                        <p class="text-sm text-gray-400" id="pageSubtitle">Manage your content</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative hidden" id="searchBox">
                        <input type="text" id="searchInput" placeholder="Search..."
                            class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 pl-10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <button id="actionBtn"
                        class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 px-6 py-2 rounded-lg font-semibold transition shadow-lg"
                        onclick="primaryAction()">
                        <i class="fas fa-plus mr-2"></i><span id="actionBtnText">New Category</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Category View -->
        <div id="categoryView">
            <div id="categoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading -->
                <div class="col-span-full flex justify-center py-20">
                    <i class="fas fa-spinner fa-spin text-4xl text-emerald-500"></i>
                </div>
            </div>
        </div>

        <!-- Article List View -->
        <div id="articleView" class="hidden">
            <div id="articleList" class="space-y-4">
                <!-- Articles loaded here -->
            </div>
        </div>

        <!-- Editor View -->
        <div id="editorView" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left: Form -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="glass rounded-2xl p-6">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i class="fas fa-heading text-emerald-400"></i> Titles
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">🇧🇩 Bangla</label>
                                <input type="text" id="titleBn"
                                    class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    placeholder="বাংলা শিরোনাম">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">🇺🇸 English</label>
                                <input type="text" id="titleEn"
                                    class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    placeholder="English Title">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">🇸🇦 Arabic</label>
                                <input type="text" id="titleAr" dir="rtl"
                                    class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                    placeholder="العنوان">
                            </div>
                        </div>
                    </div>

                    <div class="glass rounded-2xl p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold flex items-center gap-2">
                                <i class="fas fa-file-alt text-emerald-400"></i> Content
                            </h3>
                            <div class="flex gap-2 bg-white/5 p-1 rounded-lg">
                                <button onclick="autoTranslate()"
                                    class="px-3 py-2 rounded-md bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium transition flex items-center gap-2"
                                    title="Translate from current tab to others">
                                    <i class="fas fa-language"></i> Auto Translate
                                </button>
                                <div class="w-px bg-white/10 mx-1"></div>
                                <button onclick="switchLang('bn')"
                                    class="lang-tab px-4 py-2 rounded-md transition active" data-lang="bn">🇧🇩
                                    BN</button>
                                <button onclick="switchLang('en')" class="lang-tab px-4 py-2 rounded-md transition"
                                    data-lang="en">🇺🇸 EN</button>
                                <button onclick="switchLang('ar')" class="lang-tab px-4 py-2 rounded-md transition"
                                    data-lang="ar">🇸🇦 AR</button>
                            </div>
                        </div>
                        <textarea id="contentBn"
                            class="lang-content w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 min-h-[400px]"
                            placeholder="এখানে লিখুন..."></textarea>
                        <textarea id="contentEn"
                            class="lang-content hidden w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 min-h-[400px]"
                            placeholder="Write here..."></textarea>
                        <textarea id="contentAr" dir="rtl"
                            class="lang-content hidden w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 min-h-[400px]"
                            placeholder="اكتب هنا..."></textarea>
                    </div>
                </div>

                <!-- Right: Actions & Preview -->
                <div class="space-y-6">
                    <div class="glass rounded-2xl p-6">
                        <h3 class="text-lg font-semibold mb-4">Actions</h3>
                        <div class="space-y-3">
                            <button onclick="saveArticle()"
                                class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 px-4 py-3 rounded-lg font-semibold transition shadow-lg">
                                <i class="fas fa-save mr-2"></i> Save & Publish
                            </button>
                            <button id="deleteArticleBtn" onclick="deleteArticle()"
                                class="hidden w-full bg-red-500/20 hover:bg-red-500/30 border border-red-500/50 px-4 py-3 rounded-lg font-semibold transition">
                                <i class="fas fa-trash mr-2"></i> Delete Article
                            </button>
                        </div>
                    </div>

                    <div class="glass rounded-2xl p-6">
                        <h3 class="text-lg font-semibold mb-4">Info</h3>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-400">Article ID:</span>
                                <span id="articleIdDisplay" class="font-mono">New</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-400">Category:</span>
                                <span id="categoryDisplay">-</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-400">Status:</span>
                                <span class="text-emerald-400">Draft</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- AI Floating Button -->
    <button onclick="toggleAIWidget()"
        class="fixed bottom-8 right-8 w-16 h-16 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full shadow-2xl flex items-center justify-center text-white text-2xl hover:scale-110 transition z-50 animate-bounce">
        <i class="fas fa-robot"></i>
    </button>

    <!-- AI Widget -->
    <div id="aiWidget"
        class="fixed bottom-28 right-8 w-96 h-[600px] glass rounded-2xl shadow-2xl flex flex-col hidden z-50 transform transition-all duration-300 origin-bottom-right scale-0 opacity-0">
        <!-- Header -->
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5 rounded-t-2xl">
            <div class="flex items-center gap-2">
                <i class="fas fa-robot text-indigo-400"></i>
                <span class="font-bold">AI Assistant</span>
            </div>
            <div class="flex gap-2">
                <button onclick="openSettings()" class="text-gray-400 hover:text-white transition"><i
                        class="fas fa-cog"></i></button>
                <button onclick="toggleAIWidget()" class="text-gray-400 hover:text-white transition"><i
                        class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatHistory" class="flex-1 p-4 overflow-y-auto space-y-4 scrollbar-thin scrollbar-thumb-white/10">
            <div class="flex gap-3">
                <div
                    class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 flex-shrink-0">
                    <i class="fas fa-robot text-xs"></i>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl rounded-tl-none text-sm text-gray-200">
                    Hello! I can help you write articles, translate content, or generate ideas. Configure your API key
                    in settings first! 🚀
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-white/10 bg-white/5 rounded-b-2xl">
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Ask AI..."
                    class="flex-1 bg-black/20 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                    onkeypress="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()"
                    class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 rounded-lg transition">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="flex justify-between mt-2 text-xs text-gray-500">
                <select id="aiModel" class="bg-transparent border-none focus:ring-0 cursor-pointer hover:text-gray-300">
                    <option value="gemini">⚡ Gemini Pro</option>
                    <option value="gpt">🤖 GPT-4o</option>
                    <option value="deepseek">🧠 DeepSeek</option>
                </select>
                <button onclick="clearChat()" class="hover:text-red-400">Clear Chat</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal"
        class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-900 border border-white/10 rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-all scale-95 opacity-0"
            id="settingsModalContent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-cog text-emerald-400"></i> Settings
                </h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i
                        class="fas fa-times"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Gemini API Key</label>
                    <div class="flex gap-2">
                        <input type="password" id="geminiKey"
                            class="flex-1 bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                        <button onclick="testApi('gemini')"
                            class="bg-white/5 hover:bg-white/10 text-emerald-400 px-3 rounded-lg text-sm border border-white/10">Test</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">OpenAI API Key</label>
                    <div class="flex gap-2">
                        <input type="password" id="openaiKey"
                            class="flex-1 bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                        <button onclick="testApi('openai')"
                            class="bg-white/5 hover:bg-white/10 text-emerald-400 px-3 rounded-lg text-sm border border-white/10">Test</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">DeepSeek API Key</label>
                    <div class="flex gap-2">
                        <input type="password" id="deepseekKey"
                            class="flex-1 bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:border-emerald-500 focus:outline-none">
                        <button onclick="testApi('deepseek')"
                            class="bg-white/5 hover:bg-white/10 text-emerald-400 px-3 rounded-lg text-sm border border-white/10">Test</button>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3">
                <button onclick="closeSettings()"
                    class="px-4 py-2 rounded-lg text-gray-400 hover:bg-white/5 transition">Cancel</button>
                <button onclick="saveSettings()"
                    class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-medium transition shadow-lg shadow-emerald-500/20">Save
                    Settings</button>
            </div>
        </div>
    </div>

    <!-- Hidden Fields -->
    <input type="hidden" id="currentCategoryId">
    <input type="hidden" id="currentArticleId">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let categories = [];
        let currentArticles = [];
        let currentView = 'category';

        // Initialize
        window.onload = () => {
            loadCategories();
        };

        // Navigation
        function goBack() {
            if (currentView === 'article') {
                showCategoryView();
            } else if (currentView === 'editor') {
                showArticleView();
            }
        }

        function showCategoryView() {
            currentView = 'category';
            document.getElementById('categoryView').classList.remove('hidden');
            document.getElementById('articleView').classList.add('hidden');
            document.getElementById('editorView').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('searchBox').classList.add('hidden');
            document.getElementById('pageTitle').textContent = 'Article Categories';
            document.getElementById('pageSubtitle').textContent = 'Manage your content';
            document.getElementById('actionBtnText').textContent = 'New Category';
        }

        function showArticleView() {
            currentView = 'article';
            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('articleView').classList.remove('hidden');
            document.getElementById('editorView').classList.add('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('searchBox').classList.remove('hidden');
            document.getElementById('actionBtnText').textContent = 'New Article';
        }

        function showEditorView() {
            currentView = 'editor';
            document.getElementById('categoryView').classList.add('hidden');
            document.getElementById('articleView').classList.add('hidden');
            document.getElementById('editorView').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('searchBox').classList.add('hidden');
            document.getElementById('pageTitle').textContent = 'Article Editor';
            document.getElementById('pageSubtitle').textContent = 'Write in 3 languages';
        }

        function primaryAction() {
            if (currentView === 'category') {
                createCategory();
            } else if (currentView === 'article') {
                createNewArticle();
            }
        }

        // Categories
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                categories = await res.json();
                displayCategories();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Failed to load categories', 'error');
            }
        }

        function displayCategories() {
            const grid = document.getElementById('categoryGrid');
            if (categories.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400">No categories found. Create one!</div>';
                return;
            }

            grid.innerHTML = categories.map(cat => `
                <div class="glass rounded-2xl p-6 card-hover transition cursor-pointer fade-in" onclick="loadArticles('${cat.id}', '${cat.titleEn}')">
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-emerald-500/20 p-3 rounded-xl">
                            <i class="fas fa-folder text-emerald-400 text-2xl"></i>
                        </div>
                        <button onclick="event.stopPropagation(); deleteCategory('${cat.id}')" class="text-gray-400 hover:text-red-400 transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${cat.titleEn}</h3>
                    <p class="text-gray-400 text-sm">${cat.titleBn}</p>
                    <div class="mt-4 pt-4 border-t border-white/10">
                        <span class="text-xs text-gray-500">ID: ${cat.id}</span>
                    </div>
                </div>
            `).join('');
        }

        async function createCategory() {
            const { value: formValues } = await Swal.fire({
                title: 'New Category',
                html: `
                    <input id="catId" class="swal2-input" placeholder="ID (e.g. aqeedah)">
                    <input id="catBn" class="swal2-input" placeholder="Bangla Name">
                    <input id="catEn" class="swal2-input" placeholder="English Name">
                    <input id="catAr" class="swal2-input" placeholder="Arabic Name">
                `,
                focusConfirm: false,
                showCancelButton: true,
                preConfirm: () => {
                    return {
                        id: document.getElementById('catId').value,
                        titleBn: document.getElementById('catBn').value,
                        titleEn: document.getElementById('catEn').value,
                        titleAr: document.getElementById('catAr').value
                    };
                }
            });

            if (formValues && formValues.id && formValues.titleEn) {
                try {
                    await fetch('/api/categories', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formValues)
                    });
                    await fetch('/api/push', { method: 'POST' });
                    Swal.fire('Success!', 'Category created', 'success');
                    loadCategories();
                } catch (e) {
                    Swal.fire('Error', e.message, 'error');
                }
            }
        }

        async function deleteCategory(id) {
            const result = await Swal.fire({
                title: 'Delete Category?',
                text: 'This will delete the category and all its articles!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Yes, delete it'
            });

            if (result.isConfirmed) {
                try {
                    await fetch('/api/categories/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });
                    await fetch('/api/push', { method: 'POST' });
                    Swal.fire('Deleted!', 'Category deleted', 'success');
                    loadCategories();
                } catch (e) {
                    Swal.fire('Error', e.message, 'error');
                }
            }
        }

        // Articles
        async function loadArticles(categoryId, categoryTitle) {
            document.getElementById('currentCategoryId').value = categoryId;
            document.getElementById('pageTitle').textContent = categoryTitle;
            document.getElementById('pageSubtitle').textContent = `Articles in ${categoryTitle}`;
            document.getElementById('categoryDisplay').textContent = categoryTitle;

            showArticleView();
            document.getElementById('articleList').innerHTML = '<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-emerald-500"></i></div>';

            try {
                const res = await fetch(`/api/articles/${categoryId}`);
                currentArticles = await res.json();
                displayArticles();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Failed to load articles', 'error');
            }
        }

        function displayArticles() {
            const list = document.getElementById('articleList');
            if (currentArticles.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400">No articles yet. Create one!</div>';
                return;
            }

            list.innerHTML = currentArticles.map(article => `
                <div class="glass rounded-xl p-6 card-hover transition cursor-pointer fade-in" onclick='editArticle(${JSON.stringify(article).replace(/'/g, "&#39;")})'>
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold mb-2">${article.titleEn || 'Untitled'}</h3>
                            <p class="text-gray-400 text-sm mb-3">${article.titleBn || ''}</p>
                            <div class="flex items-center gap-4 text-xs text-gray-500">
                                <span><i class="fas fa-hashtag mr-1"></i>${article.id}</span>
                                <span><i class="fas fa-language mr-1"></i>3 Languages</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="event.stopPropagation(); editArticle(${JSON.stringify(article).replace(/'/g, '&#39;')})" class="text-emerald-400 hover:text-emerald-300 transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteArticleConfirm('${article.id}')" class="text-red-400 hover:text-red-300 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function createNewArticle() {
            document.getElementById('currentArticleId').value = '';
            document.getElementById('titleBn').value = '';
            document.getElementById('titleEn').value = '';
            document.getElementById('titleAr').value = '';
            document.getElementById('contentBn').value = '';
            document.getElementById('contentEn').value = '';
            document.getElementById('contentAr').value = '';
            document.getElementById('articleIdDisplay').textContent = 'New';
            document.getElementById('deleteArticleBtn').classList.add('hidden');
            showEditorView();
        }

        function editArticle(article) {
            document.getElementById('currentArticleId').value = article.id;
            document.getElementById('titleBn').value = article.titleBn || '';
            document.getElementById('titleEn').value = article.titleEn || '';
            document.getElementById('titleAr').value = article.titleAr || '';
            document.getElementById('contentBn').value = article.contentBn || '';
            document.getElementById('contentEn').value = article.contentEn || '';
            document.getElementById('contentAr').value = article.contentAr || '';
            document.getElementById('articleIdDisplay').textContent = article.id;
            document.getElementById('deleteArticleBtn').classList.remove('hidden');
            showEditorView();
        }

        async function saveArticle() {
            const categoryId = document.getElementById('currentCategoryId').value;
            const articleId = document.getElementById('currentArticleId').value || `${categoryId}-${Date.now()}`;

            const article = {
                id: articleId,
                categoryId: categoryId,
                titleBn: document.getElementById('titleBn').value,
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                contentBn: document.getElementById('contentBn').value,
                contentEn: document.getElementById('contentEn').value,
                contentAr: document.getElementById('contentAr').value
            };

            if (!article.titleEn) {
                Swal.fire('Error', 'English title is required', 'error');
                return;
            }

            try {
                Swal.fire({ title: 'Saving...', didOpen: () => Swal.showLoading() });

                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: categoryId, article })
                });
                await fetch('/api/push', { method: 'POST' });

                Swal.fire('Success!', 'Article saved and published', 'success');
                loadArticles(categoryId, document.getElementById('pageTitle').textContent);
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

        async function deleteArticleConfirm(id) {
            const result = await Swal.fire({
                title: 'Delete Article?',
                text: 'This action cannot be undone!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Yes, delete it'
            });

            if (result.isConfirmed) {
                await deleteArticleById(id);
            }
        }

        async function deleteArticle() {
            const id = document.getElementById('currentArticleId').value;
            await deleteArticleConfirm(id);
        }

        async function deleteArticleById(id) {
            const categoryId = document.getElementById('currentCategoryId').value;

            try {
                Swal.fire({ title: 'Deleting...', didOpen: () => Swal.showLoading() });

                await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: categoryId, id })
                });
                await fetch('/api/push', { method: 'POST' });

                Swal.fire('Deleted!', 'Article deleted', 'success');
                loadArticles(categoryId, document.getElementById('pageTitle').textContent);
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

        // Language Tabs
        function switchLang(lang) {
            document.querySelectorAll('.lang-tab').forEach(tab => {
                tab.classList.remove('active', 'bg-emerald-500', 'text-white');
                tab.classList.add('text-gray-400');
            });
            document.querySelectorAll('.lang-content').forEach(content => {
                content.classList.add('hidden');
            });

            const activeTab = document.querySelector(`[data-lang="${lang}"]`);
            activeTab.classList.add('active', 'bg-emerald-500', 'text-white');
            activeTab.classList.remove('text-gray-400');

            document.getElementById(`content${lang.charAt(0).toUpperCase() + lang.slice(1)}`).classList.remove('hidden');
        }

        // Translation
        async function autoTranslate() {
            // Determine active language
            let sourceLang = 'bn';
            document.querySelectorAll('.lang-tab').forEach(tab => {
                if (tab.classList.contains('active')) sourceLang = tab.dataset.lang;
            });

            const titleId = `title${sourceLang.charAt(0).toUpperCase() + sourceLang.slice(1)}`;
            const contentId = `content${sourceLang.charAt(0).toUpperCase() + sourceLang.slice(1)}`;

            const sourceTitle = document.getElementById(titleId).value;
            const sourceContent = document.getElementById(contentId).value;

            if (!sourceTitle && !sourceContent) {
                return Swal.fire('Warning', 'Please write something first!', 'warning');
            }

            Swal.fire({
                title: 'Translating...',
                text: 'Please wait while we translate your content.',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const targets = ['bn', 'en', 'ar'].filter(l => l !== sourceLang);

            try {
                for (const target of targets) {
                    const targetTitleId = `title${target.charAt(0).toUpperCase() + target.slice(1)}`;
                    const targetContentId = `content${target.charAt(0).toUpperCase() + target.slice(1)}`;

                    // Translate Title
                    if (sourceTitle) {
                        const res = await fetch('/api/translate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: sourceTitle, target })
                        });
                        const data = await res.json();
                        if (data.translated) document.getElementById(targetTitleId).value = data.translated;
                    }

                    // Translate Content
                    if (sourceContent) {
                        const res = await fetch('/api/translate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: sourceContent, target })
                        });
                        const data = await res.json();
                        if (data.translated) document.getElementById(targetContentId).value = data.translated;
                    }
                }
                Swal.fire('Success', 'Translation complete!', 'success');
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'Translation failed', 'error');
            }
        }

        // --- AI & Settings ---
        function toggleAIWidget() {
            const widget = document.getElementById('aiWidget');
            if (widget.classList.contains('hidden')) {
                widget.classList.remove('hidden');
                setTimeout(() => {
                    widget.classList.remove('scale-0', 'opacity-0');
                    widget.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                widget.classList.remove('scale-100', 'opacity-100');
                widget.classList.add('scale-0', 'opacity-0');
                setTimeout(() => widget.classList.add('hidden'), 300);
            }
        }

        function openSettings() {
            document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
            document.getElementById('openaiKey').value = localStorage.getItem('openaiKey') || '';
            document.getElementById('deepseekKey').value = localStorage.getItem('deepseekKey') || '';

            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveSettings() {
            localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
            localStorage.setItem('openaiKey', document.getElementById('openaiKey').value);
            localStorage.setItem('deepseekKey', document.getElementById('deepseekKey').value);
            closeSettings();
            Swal.fire('Saved', 'API Keys saved successfully', 'success');
        }

        async function testApi(provider) {
            const key = document.getElementById(`${provider}Key`).value;
            if (!key) return Swal.fire('Error', 'Please enter an API key', 'error');

            Swal.fire({ title: 'Testing...', didOpen: () => Swal.showLoading() });

            try {
                let success = false;
                if (provider === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Hello" }] }] })
                    });
                    success = res.ok;
                } else if (provider === 'openai') {
                    const res = await fetch('https://api.openai.com/v1/models', {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    success = res.ok;
                } else if (provider === 'deepseek') {
                    // DeepSeek API test (assuming similar to OpenAI structure)
                    const res = await fetch('https://api.deepseek.com/v1/models', {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    success = res.ok;
                }

                if (success) Swal.fire('Success', 'API Key is valid!', 'success');
                else Swal.fire('Error', 'Invalid API Key', 'error');
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            // Add User Message
            addMessage(message, 'user');
            input.value = '';

            // Get Config
            const model = document.getElementById('aiModel').value;
            const key = localStorage.getItem(`${model}Key`);

            if (!key) {
                addMessage('Please configure your API key in settings first.', 'ai');
                return;
            }

            // Show Typing
            const typingId = addMessage('<i class="fas fa-circle-notch fa-spin"></i> Thinking...', 'ai');

            try {
                let responseText = '';

                if (model === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
                    });
                    const data = await res.json();
                    responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error generating response';
                }
                else if (model === 'gpt') {
                    const res = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${key}`
                        },
                        body: JSON.stringify({
                            model: "gpt-4o",
                            messages: [{ role: "user", content: message }]
                        })
                    });
                    const data = await res.json();
                    responseText = data.choices?.[0]?.message?.content || 'Error generating response';
                }
                else if (model === 'deepseek') {
                    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${key}`
                        },
                        body: JSON.stringify({
                            model: "deepseek-chat",
                            messages: [{ role: "user", content: message }]
                        })
                    });
                    const data = await res.json();
                    responseText = data.choices?.[0]?.message?.content || 'Error generating response';
                }

                // Update Message
                document.getElementById(typingId).innerHTML = marked.parse(responseText);
            } catch (e) {
                document.getElementById(typingId).innerHTML = 'Error: ' + e.message;
            }
        }

        function addMessage(text, sender) {
            const history = document.getElementById('chatHistory');
            const id = 'msg-' + Date.now();
            const isAi = sender === 'ai';

            const html = `
                <div class="flex gap-3 ${!isAi ? 'flex-row-reverse' : ''}" id="${id}">
                    <div class="w-8 h-8 rounded-full ${isAi ? 'bg-indigo-500/20 text-indigo-400' : 'bg-emerald-500/20 text-emerald-400'} flex items-center justify-center flex-shrink-0">
                        <i class="fas ${isAi ? 'fa-robot' : 'fa-user'} text-xs"></i>
                    </div>
                    <div class="${isAi ? 'bg-white/5 text-gray-200' : 'bg-emerald-500/20 text-white'} p-3 rounded-2xl ${isAi ? 'rounded-tl-none' : 'rounded-tr-none'} text-sm max-w-[80%]">
                        ${text}
                    </div>
                </div>
            `;

            history.insertAdjacentHTML('beforeend', html);
            history.scrollTop = history.scrollHeight;
            return id;
        }

        function clearChat() {
            document.getElementById('chatHistory').innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 flex-shrink-0">
                        <i class="fas fa-robot text-xs"></i>
                    </div>
                    <div class="bg-white/5 p-3 rounded-2xl rounded-tl-none text-sm text-gray-200">
                        Chat cleared. How can I help?
                    </div>
                </div>
            `;
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = currentArticles.filter(article =>
                article.titleEn?.toLowerCase().includes(query) ||
                article.titleBn?.toLowerCase().includes(query) ||
                article.id?.toLowerCase().includes(query)
            );

            const list = document.getElementById('articleList');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-20 text-gray-400">No articles found</div>';
                return;
            }

            list.innerHTML = filtered.map(article => `
                <div class="glass rounded-xl p-6 card-hover transition cursor-pointer fade-in" onclick='editArticle(${JSON.stringify(article).replace(/'/g, "&#39;")})'>
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-lg font-bold mb-2">${article.titleEn || 'Untitled'}</h3>
                            <p class="text-gray-400 text-sm mb-3">${article.titleBn || ''}</p>
                            <div class="flex items-center gap-4 text-xs text-gray-500">
                                <span><i class="fas fa-hashtag mr-1"></i>${article.id}</span>
                                <span><i class="fas fa-language mr-1"></i>3 Languages</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="event.stopPropagation(); editArticle(${JSON.stringify(article).replace(/'/g, '&#39;')})" class="text-emerald-400 hover:text-emerald-300 transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteArticleConfirm('${article.id}')" class="text-red-400 hover:text-red-300 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        });
    </script>
