<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --chat-width: 380px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        /* Sidebar Styles */
        .sidebar {
            min-height: 100vh;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }

        /* AI Floating Widget */
        .ai-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .ai-fab:hover {
            transform: scale(1.1);
        }

        .ai-widget {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: var(--chat-width);
            height: 600px;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            z-index: 1999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-widget.open {
            display: flex;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background: #e0e7ff;
            color: #3730a3;
            border-bottom-right-radius: 2px;
        }

        [data-bs-theme="dark"] .message.user {
            background: #312e81;
            color: #e0e7ff;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bs-secondary-bg);
            border-bottom-left-radius: 2px;
        }

        /* Themes */
        [data-theme="forest"] {
            --bs-body-bg: #f0fdf4;
            --bs-body-color: #14532d;
            --bs-primary: #15803d;
        }

        [data-theme="midnight"] {
            --bs-body-bg: #0f172a;
            --bs-body-color: #e2e8f0;
            --bs-primary: #38bdf8;
            --bs-border-color: #1e293b;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-body-tertiary sidebar collapse">
                <div class="position-sticky pt-3" style="height: 100vh; overflow-y: auto;">
                    <div class="d-flex align-items-center justify-content-between px-3 mb-4">
                        <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-book-half me-2"></i>SunnahWay</h5>
                    </div>

                    <div class="mb-3 px-3">
                        <label class="form-label fw-bold">Select Category</label>
                        <select id="category" class="form-select" onchange="loadArticles()">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div class="d-grid gap-2 px-3">
                        <button class="btn btn-primary" onclick="createNew()">+ New Article</button>
                        <button class="btn btn-outline-secondary" onclick="openCategoryModal()">Manage
                            Categories</button>
                    </div>

                    <hr class="my-3 mx-3">

                    <!-- Theme Selector -->
                    <div class="px-3 mb-3">
                        <label class="form-label small text-muted">Theme</label>
                        <select class="form-select form-select-sm" onchange="setTheme(this.value)">
                            <option value="light">☀️ Light</option>
                            <option value="dark">🌙 Dark</option>
                            <option value="forest">🌲 Forest</option>
                            <option value="midnight">🌌 Midnight</option>
                        </select>
                    </div>

                    <div class="list-group list-group-flush mt-3 pb-5" id="articleList">
                        <!-- Article List -->
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2 text-primary">Editor</h1>
                    <div class="btn-toolbar mb-2 mb-md-0 gap-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="openSettings()">
                            <i class="bi bi-gear"></i> Settings
                        </button>
                        <button class="btn btn-sm btn-success" onclick="publishArticle()">
                            <i class="bi bi-cloud-upload"></i> Save & Publish
                        </button>
                    </div>
                </div>

                <input type="hidden" id="articleId">
                <input type="hidden" id="originalCategory">

                <!-- Title Inputs & Category Select -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="form-floating">
                            <select id="editorCategory" class="form-select">
                                <!-- Populated dynamically -->
                            </select>
                            <label>Category</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" id="titleBn" class="form-control" placeholder="Title">
                            <label>Title (Bangla)</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" id="titleEn" class="form-control" placeholder="Title">
                            <label>Title (English)</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-floating">
                            <input type="text" id="titleAr" class="form-control" placeholder="Title" dir="rtl">
                            <label>Title (Arabic)</label>
                        </div>
                    </div>
                </div>

                <!-- Editor Area -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-header bg-transparent py-2">
                        <ul class="nav nav-tabs card-header-tabs" id="langTabs" role="tablist">
                            <li class="nav-item"><button class="nav-link active" id="bn-tab" data-bs-toggle="tab"
                                    data-bs-target="#bn-content">🇧🇩 Bangla</button></li>
                            <li class="nav-item"><button class="nav-link" id="en-tab" data-bs-toggle="tab"
                                    data-bs-target="#en-content">🇺🇸 English</button></li>
                            <li class="nav-item"><button class="nav-link" id="ar-tab" data-bs-toggle="tab"
                                    data-bs-target="#ar-content">🇸🇦 Arabic</button></li>
                        </ul>
                    </div>
                    <div class="card-body p-0">
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="bn-content"><textarea id="contentBn"
                                    class="form-control border-0 p-3" rows="20"
                                    placeholder="Write content here..."></textarea></div>
                            <div class="tab-pane fade" id="en-content"><textarea id="contentEn"
                                    class="form-control border-0 p-3" rows="20"
                                    placeholder="Write content here..."></textarea></div>
                            <div class="tab-pane fade" id="ar-content"><textarea id="contentAr"
                                    class="form-control border-0 p-3" rows="20" placeholder="Write content here..."
                                    dir="rtl"></textarea></div>
                        </div>
                    </div>
                </div>

                <!-- Delete Button (Only visible when editing existing) -->
                <div class="d-flex justify-content-between">
                    <button id="deleteBtn" onclick="deleteArticle()" class="btn btn-outline-danger"
                        style="display: none;">
                        <i class="bi bi-trash"></i> Delete Article
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- AI Floating Button -->
    <button class="ai-fab" onclick="toggleAIWidget()">
        <i class="bi bi-stars"></i>
    </button>

    <!-- AI Widget -->
    <div class="ai-widget" id="aiWidget">
        <!-- Header -->
        <div class="p-3 border-bottom bg-body-tertiary d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-robot text-primary fs-5"></i>
                <select id="aiModel" class="form-select form-select-sm border-0 bg-transparent fw-bold"
                    style="width: auto; cursor: pointer;">
                    <option value="gemini-2.0-flash">⚡ Gemini 2.0 Flash</option>
                    <option value="gemini-2.5-flash">🚀 Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-pro">🧠 Gemini 2.5 Pro</option>
                    <option value="gpt-4o">🤖 GPT-4o</option>
                </select>
            </div>
            <button class="btn-close" onclick="toggleAIWidget()"></button>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs nav-fill border-bottom-0" role="tablist">
            <li class="nav-item"><button class="nav-link active rounded-0 border-top-0 border-start-0"
                    data-bs-toggle="tab" data-bs-target="#chat-tab">💬 Chat</button></li>
            <li class="nav-item"><button class="nav-link rounded-0 border-top-0 border-end-0" data-bs-toggle="tab"
                    data-bs-target="#agent-tab">⚡ Agent</button></li>
        </ul>

        <!-- Content -->
        <div class="tab-content flex-grow-1 d-flex flex-column overflow-hidden">

            <!-- Chat Tab -->
            <div class="tab-pane fade show active h-100 d-flex flex-column" id="chat-tab">
                <div class="chat-messages" id="chatHistory">
                    <div class="message ai">Hello! I am your Islamic Assistant. How can I help you today?</div>
                </div>
                <div class="p-3 border-top bg-body-tertiary">
                    <div class="input-group">
                        <input type="text" id="chatInput" class="form-control" placeholder="Ask something..."
                            onkeypress="if(event.key==='Enter') sendChat()">
                        <button class="btn btn-primary" onclick="sendChat()"><i class="bi bi-send"></i></button>
                    </div>
                </div>
            </div>

            <!-- Agent Tab -->
            <div class="tab-pane fade h-100 p-4 overflow-auto" id="agent-tab">
                <div class="text-center mb-4">
                    <div class="display-1 mb-2">⚡</div>
                    <h5>Article Generator</h5>
                    <p class="text-muted small">Enter a topic and I will write the full article in 3 languages and
                        fill
                        the editor.</p>
                </div>
                <div class="mb-3">
                    <label class="form-label">Topic</label>
                    <textarea id="agentTopic" class="form-control" rows="3"
                        placeholder="e.g. Importance of Zakat in Islam"></textarea>
                </div>
                <button class="btn btn-primary w-100 py-2 mb-3" onclick="runAgent()">
                    <i class="bi bi-magic me-2"></i>Generate Article
                </button>
                <div id="agentStatus" class="text-center small text-muted"></div>
            </div>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Manage Categories</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Add New Category Form -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <h6 class="card-title mb-3">Add New Category</h6>
                            <div class="row g-2">
                                <div class="col-md-3"><input type="text" id="newCatId"
                                        class="form-control form-control-sm" placeholder="ID (e.g. history)"></div>
                                <div class="col-md-3"><input type="text" id="newCatBn"
                                        class="form-control form-control-sm" placeholder="Bangla Name"></div>
                                <div class="col-md-3"><input type="text" id="newCatEn"
                                        class="form-control form-control-sm" placeholder="English Name"></div>
                                <div class="col-md-3"><input type="text" id="newCatAr"
                                        class="form-control form-control-sm" placeholder="Arabic Name" dir="rtl">
                                </div>
                                <div class="col-12 mt-2"><button class="btn btn-sm btn-success w-100"
                                        onclick="addCategory()">Add Category</button></div>
                            </div>
                        </div>
                    </div>

                    <!-- Category List -->
                    <h6 class="mb-3">Existing Categories</h6>
                    <div class="list-group" id="categoryListModal">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">API Settings</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Gemini API Key</label>
                        <div class="input-group">
                            <input type="password" id="geminiKey" class="form-control">
                            <button class="btn btn-outline-secondary" type="button"
                                onclick="testGeminiConnection()">Test Key</button>
                        </div>
                        <div id="geminiStatus" class="form-text"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">OpenAI API Key</label>
                        <div class="input-group">
                            <input type="password" id="openaiKey" class="form-control">
                            <button class="btn btn-outline-secondary" type="button"
                                onclick="testOpenAIConnection()">Test Key</button>
                        </div>
                        <div id="openaiStatus" class="form-text"></div>
                    </div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-primary"
                        onclick="saveSettings()">Save</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // --- Init ---
        window.onload = async () => {
            await fetchCategories();
            loadArticles();
            setTheme(localStorage.getItem('app_theme') || 'light');
            loadSettings();
        };

        // --- Category Logic ---
        async function fetchCategories() {
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();

                const sidebarSelect = document.getElementById('category');
                const editorSelect = document.getElementById('editorCategory');
                const modalList = document.getElementById('categoryListModal');

                // Save current selection if any
                const currentSidebarVal = sidebarSelect.value;
                const currentEditorVal = editorSelect.value;

                sidebarSelect.innerHTML = '';
                editorSelect.innerHTML = '';
                modalList.innerHTML = '';

                categories.forEach(cat => {
                    // Populate Selects
                    const optionText = `${cat.titleEn} (${cat.titleBn})`;
                    sidebarSelect.add(new Option(optionText, cat.id));
                    editorSelect.add(new Option(optionText, cat.id));

                    // Populate Modal List
                    const item = document.createElement('div');
                    item.className = 'list-group-item d-flex justify-content-between align-items-center';
                    item.innerHTML = `
                        <div>
                            <strong>${cat.titleEn}</strong> <small class="text-muted">(${cat.titleBn})</small><br>
                            <small class="text-muted">ID: ${cat.id}</small>
                        </div>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory('${cat.id}')"><i class="bi bi-trash"></i></button>
                    `;
                    modalList.appendChild(item);
                });

                // Restore selection or default to first
                if (currentSidebarVal && categories.some(c => c.id === currentSidebarVal)) sidebarSelect.value = currentSidebarVal;
                if (currentEditorVal && categories.some(c => c.id === currentEditorVal)) editorSelect.value = currentEditorVal;

            } catch (e) { console.error('Failed to fetch categories', e); }
        }

        function openCategoryModal() {
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }

        async function addCategory() {
            const id = document.getElementById('newCatId').value.trim();
            const titleBn = document.getElementById('newCatBn').value.trim();
            const titleEn = document.getElementById('newCatEn').value.trim();
            const titleAr = document.getElementById('newCatAr').value.trim();

            if (!id || !titleBn || !titleEn) return Swal.fire('Error', 'ID, Bangla & English titles required', 'error');

            try {
                await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, titleBn, titleEn, titleAr })
                });

                // Push to GitHub
                await fetch('/api/push', { method: 'POST' });

                // Clear inputs
                ['newCatId', 'newCatBn', 'newCatEn', 'newCatAr'].forEach(i => document.getElementById(i).value = '');

                await fetchCategories();
                Swal.fire('Success', 'Category added & Pushed to GitHub', 'success');
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        async function deleteCategory(id) {
            const result = await Swal.fire({
                title: 'Delete Category?',
                text: `This will delete the category "${id}" and its data file.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!'
            });

            if (result.isConfirmed) {
                Swal.fire({ title: 'Deleting...', didOpen: () => Swal.showLoading() });
                try {
                    await fetch('/api/categories/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })
                    });

                    // Push to GitHub
                    await fetch('/api/push', { method: 'POST' });

                    await fetchCategories();
                    Swal.fire('Deleted!', 'Category deleted & changes pushed.', 'success');
                    loadArticles(); // Refresh article list as category might be gone
                } catch (e) { Swal.fire('Error', e.message, 'error'); }
            }
        }

        // --- UI Logic ---
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', (theme === 'dark' || theme === 'midnight') ? 'dark' : 'light');
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
        }

        function toggleAIWidget() {
            document.getElementById('aiWidget').classList.toggle('open');
        }

        function openSettings() {
            new bootstrap.Modal(document.getElementById('settingsModal')).show();
        }

        function loadSettings() {
            document.getElementById('geminiKey').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('openaiKey').value = localStorage.getItem('openai_api_key') || '';
        }

        function saveSettings() {
            localStorage.setItem('gemini_api_key', document.getElementById('geminiKey').value);
            localStorage.setItem('openai_api_key', document.getElementById('openaiKey').value);
            bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
            Swal.fire({ icon: 'success', title: 'Saved', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        }

        async function testGeminiConnection() {
            const key = document.getElementById('geminiKey').value;
            const statusDiv = document.getElementById('geminiStatus');
            if (!key) { statusDiv.innerHTML = '<span class="text-danger">Enter key first</span>'; return; }

            statusDiv.innerHTML = '<span class="text-info">Testing...</span>';

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                const availableModels = data.models.map(m => m.name.replace('models/', '')).filter(n => n.includes('gemini'));
                statusDiv.innerHTML = `<span class="text-success">Success! Available: ${availableModels.join(', ')}</span>`;
                console.log('Available Models:', availableModels);
            } catch (e) {
                statusDiv.innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
            }
        }

        async function testOpenAIConnection() {
            const key = document.getElementById('openaiKey').value;
            const statusDiv = document.getElementById('openaiStatus');
            if (!key) { statusDiv.innerHTML = '<span class="text-danger">Enter key first</span>'; return; }

            statusDiv.innerHTML = '<span class="text-info">Testing...</span>';

            try {
                const res = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                statusDiv.innerHTML = '<span class="text-success">Success! Key is valid.</span>';
            } catch (e) {
                statusDiv.innerHTML = `<span class="text-danger">Error: ${e.message}</span>`;
            }
        }

        // --- Core Functions ---
        async function loadArticles() {
            const category = document.getElementById('category').value;
            const listDiv = document.getElementById('articleList');
            listDiv.innerHTML = '<div class="text-center text-muted mt-3"><div class="spinner-border spinner-border-sm"></div> Loading...</div>';

            if (!category) {
                listDiv.innerHTML = '<div class="text-center text-muted mt-3">Please select a category</div>';
                return;
            }

            try {
                const res = await fetch(`/api/articles/${category}`);
                const articles = await res.json();
                listDiv.innerHTML = '';
                if (articles.length === 0) { listDiv.innerHTML = '<div class="text-center text-muted mt-3">No articles found</div>'; return; }
                articles.forEach(article => {
                    const item = document.createElement('button');
                    item.className = 'list-group-item list-group-item-action border-0 border-bottom';
                    item.innerHTML = `<div class="fw-bold text-truncate">${article.titleBn || 'No Title'}</div><small class="text-muted text-truncate d-block">${article.titleEn || ''}</small>`;
                    item.onclick = () => loadEditor(article);
                    listDiv.appendChild(item);
                });
            } catch (e) { listDiv.innerHTML = '<div class="text-danger text-center mt-3">Failed to load</div>'; }
        }

        function loadEditor(article) {
            document.getElementById('articleId').value = article.id;

            // Set category
            const currentCategory = document.getElementById('category').value;
            document.getElementById('editorCategory').value = currentCategory;
            document.getElementById('originalCategory').value = currentCategory;

            // Show delete button
            document.getElementById('deleteBtn').style.display = 'block';

            ['titleBn', 'titleEn', 'titleAr', 'contentBn', 'contentEn', 'contentAr'].forEach(id => document.getElementById(id).value = article[id] || '');
        }

        function createNew() {
            document.getElementById('articleId').value = '';
            document.getElementById('originalCategory').value = '';

            // Set default category to sidebar selection
            document.getElementById('editorCategory').value = document.getElementById('category').value;

            // Hide delete button
            document.getElementById('deleteBtn').style.display = 'none';

            ['titleBn', 'titleEn', 'titleAr', 'contentBn', 'contentEn', 'contentAr'].forEach(id => document.getElementById(id).value = '');
        }

        async function publishArticle() {
            const targetCategory = document.getElementById('editorCategory').value;
            const originalCategory = document.getElementById('originalCategory').value;
            const articleId = document.getElementById('articleId').value || `${targetCategory}-${Date.now()}`;

            const article = {
                id: articleId,
                categoryId: targetCategory,
                titleBn: document.getElementById('titleBn').value,
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                contentBn: document.getElementById('contentBn').value,
                contentEn: document.getElementById('contentEn').value,
                contentAr: document.getElementById('contentAr').value
            };

            if (!article.titleBn || !article.contentBn) return Swal.fire('Error', 'Title & Content required', 'error');
            Swal.fire({ title: 'Saving...', didOpen: () => Swal.showLoading() });

            try {
                // If category changed and it's an existing article, delete from old category first
                if (originalCategory && originalCategory !== targetCategory) {
                    await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category: originalCategory, id: articleId })
                    });
                }

                await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ category: targetCategory, article }) });
                await fetch('/api/push', { method: 'POST' });

                Swal.fire('Published!', 'Saved to GitHub', 'success');

                // Refresh list if we are viewing the target category or the original one
                const sidebarCategory = document.getElementById('category').value;
                if (sidebarCategory === targetCategory || sidebarCategory === originalCategory) {
                    loadArticles();
                }

                // Update original category to new one
                document.getElementById('originalCategory').value = targetCategory;
                document.getElementById('deleteBtn').style.display = 'block';
                document.getElementById('articleId').value = articleId;

            } catch (e) { Swal.fire('Failed', e.message, 'error'); }
        }

        async function deleteArticle() {
            const id = document.getElementById('articleId').value;
            const category = document.getElementById('originalCategory').value; // Delete from where it was loaded

            if (!id) return;

            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            });

            if (result.isConfirmed) {
                Swal.fire({ title: 'Deleting...', didOpen: () => Swal.showLoading() });
                try {
                    await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category, id })
                    });
                    await fetch('/api/push', { method: 'POST' });

                    Swal.fire('Deleted!', 'Article has been deleted.', 'success');
                    createNew(); // Clear editor
                    loadArticles(); // Refresh list
                } catch (e) {
                    Swal.fire('Error', e.message, 'error');
                }
            }
        }

        // --- AI Logic ---
        async function callAI(prompt, isJson = false) {
            const modelSelect = document.getElementById('aiModel').value;
            const provider = modelSelect.includes('gpt') ? 'openai' : 'gemini';
            const apiKey = localStorage.getItem(`${provider}_api_key`);

            if (!apiKey) throw new Error(`Please set ${provider.toUpperCase()} API Key in Settings`);

            if (provider === 'gemini') {
                // Use the selected model first, then fall back to reliable aliases
                let candidateModels = [modelSelect];

                // Add fallbacks based on user's available list
                if (modelSelect.includes('flash')) {
                    candidateModels.push('gemini-2.0-flash', 'gemini-2.5-flash', 'gemini-flash-latest');
                } else {
                    candidateModels.push('gemini-2.5-pro', 'gemini-pro-latest');
                }

                let lastError = null;

                for (const modelName of candidateModels) {
                    try {
                        console.log(`Attempting model: ${modelName}`);
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                        const res = await fetch(url, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });

                        const data = await res.json();

                        if (data.error) {
                            console.warn(`Model ${modelName} error:`, data.error);
                            lastError = data.error.message;
                            continue; // Try next model
                        }

                        return data.candidates[0].content.parts[0].text;

                    } catch (e) {
                        console.error(`Network/Other error with ${modelName}:`, e);
                        lastError = e.message;
                    }
                }
                throw new Error(`Failed to connect to Gemini. Last error: ${lastError}`);

            } else {
                // OpenAI Logic (unchanged)
                const res = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: modelSelect,
                        messages: [{ role: 'user', content: prompt }],
                        response_format: isJson ? { type: "json_object" } : undefined
                    })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                return data.choices[0].message.content;
            }
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const history = document.getElementById('chatHistory');
            history.innerHTML += `<div class="message user">${msg}</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            try {
                const response = await callAI(msg);
                history.innerHTML += `<div class="message ai">${response.replace(/\n/g, '<br>')}</div>`;
            } catch (e) {
                history.innerHTML += `<div class="message ai text-danger">Error: ${e.message}</div>`;
            }
            history.scrollTop = history.scrollHeight;
        }

        async function runAgent() {
            const topic = document.getElementById('agentTopic').value;
            if (!topic) {
                Swal.fire('Topic Required', 'Please enter a topic first.', 'warning');
                return;
            }

            const status = document.getElementById('agentStatus');
            status.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div> <span class="text-primary">Writing article... This may take a few seconds.</span>';

            const prompt = `
                You are an expert Islamic scholar. Write a comprehensive article about: "${topic}".
                
                IMPORTANT: You must return ONLY a valid JSON object. Do not add any markdown formatting like \`\`\`json or \`\`\`.
                
                The JSON structure must be exactly this:
                {
                    "titleBn": "Title in Bangla",
                    "titleEn": "Title in English",
                    "titleAr": "Title in Arabic",
                    "contentBn": "Full content in Bangla (use Markdown for headings, lists, bold)",
                    "contentEn": "Full content in English (use Markdown)",
                    "contentAr": "Full content in Arabic (use Markdown)"
                }
            `;

            try {
                console.log('Sending request to AI...');
                let text = await callAI(prompt, true);
                console.log('Raw AI Response:', text);

                // Robust JSON extraction: Find the first '{' and last '}'
                const jsonStart = text.indexOf('{');
                const jsonEnd = text.lastIndexOf('}');

                if (jsonStart === -1 || jsonEnd === -1) {
                    throw new Error('AI did not return valid JSON. Check console for raw output.');
                }

                const jsonStr = text.substring(jsonStart, jsonEnd + 1);
                const result = JSON.parse(jsonStr);

                // Populate fields safely
                if (result.titleBn) document.getElementById('titleBn').value = result.titleBn;
                if (result.titleEn) document.getElementById('titleEn').value = result.titleEn;
                if (result.titleAr) document.getElementById('titleAr').value = result.titleAr;
                if (result.contentBn) document.getElementById('contentBn').value = result.contentBn;
                if (result.contentEn) document.getElementById('contentEn').value = result.contentEn;
                if (result.contentAr) document.getElementById('contentAr').value = result.contentAr;

                status.innerHTML = '<span class="text-success fw-bold"><i class="bi bi-check-circle"></i> Done! Article populated.</span>';

                // Close widget after a short delay
                setTimeout(() => {
                    toggleAIWidget();
                    Swal.fire({
                        icon: 'success',
                        title: 'Article Generated!',
                        text: 'Review the content in the editor.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }, 1000);

            } catch (e) {
                console.error('Agent Error:', e);
                status.innerHTML = `<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> Error: ${e.message}</span>`;
            }
        }
    </script>
