<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Article Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .preview { background: #f1f1f1; padding: 15px; border-radius: 5px; margin-top: 10px; white-space: pre-wrap; }
        .btn-toolbar { margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">SunnahWay Article Admin</h2>
    
    <div class="mb-3">
        <label class="form-label">GitHub Token (One time)</label>
        <input type="password" id="token" class="form-control" placeholder="ghp_xxxxxxxxxxxx">
        <div class="form-text">Settings -> Developer settings -> Personal access tokens -> Generate new token (Select 'repo' scope)</div>
    </div>

    <hr>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <select id="category" class="form-select">
            <option value="seerah">Seerah (সীরাত)</option>
            <option value="aqeedah">Aqeedah (আকিদাহ)</option>
            <option value="fiqh">Fiqh (ফিকহ)</option>
            <option value="hadith">Hadith (হাদিস)</option>
            <option value="tafseer">Tafseer (তাফসির)</option>
        </select>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Title (Bangla)</label>
            <input type="text" id="titleBn" class="form-control" placeholder="বাংলা শিরোনাম">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Title (English)</label>
            <input type="text" id="titleEn" class="form-control" placeholder="English Title">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Title (Arabic)</label>
            <input type="text" id="titleAr" class="form-control" placeholder="العنوان العربي">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Content (Bangla)</label>
        <div class="btn-toolbar" role="toolbar">
            <div class="btn-group me-2" role="group">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertFormat('**', '**')"><b>Bold</b></button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertFormat('*', '*')"><i>Italic</i></button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertFormat('## ', '')">Heading</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="insertFormat('\n- ', '')">List</button>
            </div>
        </div>
        <textarea id="contentBn" class="form-control" rows="10" placeholder="এখানে লিখুন..."></textarea>
    </div>

    <button onclick="publishArticle()" class="btn btn-primary w-100">🚀 Publish Article</button>
    <div id="status" class="mt-3 text-center"></div>
</div>

<script>
    function insertFormat(start, end) {
        const textarea = document.getElementById('contentBn');
        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const text = textarea.value;
        const selectedText = text.substring(startPos, endPos);
        
        const newText = text.substring(0, startPos) + start + selectedText + end + text.substring(endPos);
        textarea.value = newText;
        textarea.focus();
        textarea.selectionStart = startPos + start.length;
        textarea.selectionEnd = endPos + start.length;
    }

    async function publishArticle() {
        const token = document.getElementById('token').value;
        if (!token) { alert('Please enter GitHub Token'); return; }

        const category = document.getElementById('category').value;
        const titleBn = document.getElementById('titleBn').value;
        const titleEn = document.getElementById('titleEn').value;
        const titleAr = document.getElementById('titleAr').value;
        const contentBn = document.getElementById('contentBn').value;

        if (!titleBn || !contentBn) { alert('Please fill required fields'); return; }

        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '<span class="text-primary">Fetching existing articles...</span>';

        const repo = 'nokibulhasansiam3-sta/sunnahway-Article';
        const path = `data/${category}.json`;
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;

        try {
            // 1. Get existing file
            const getRes = await fetch(url, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            
            if (!getRes.ok) throw new Error('Failed to fetch file');
            
            const fileData = await getRes.json();
            const content = atob(fileData.content); // Decode Base64
            const articles = JSON.parse(content);

            // 2. Add new article
            const newArticle = {
                id: `${category}-${Date.now()}`,
                categoryId: category,
                titleBn, titleEn, titleAr,
                contentBn,
                contentEn: "Content coming soon...",
                contentAr: "المحتوى قريبا..."
            };
            
            articles.push(newArticle);

            // 3. Update file
            const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(articles, null, 2)))); // Encode Base64
            
            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Add new article: ${titleBn}`,
                    content: newContent,
                    sha: fileData.sha
                })
            });

            if (putRes.ok) {
                statusDiv.innerHTML = '<span class="text-success">✅ Article Published Successfully! Check your app.</span>';
                document.getElementById('titleBn').value = '';
                document.getElementById('contentBn').value = '';
            } else {
                throw new Error('Failed to update file');
            }

        } catch (error) {
            statusDiv.innerHTML = `<span class="text-danger">❌ Error: ${error.message}</span>`;
            console.error(error);
        }
    }
</script>

</body>
</html>
