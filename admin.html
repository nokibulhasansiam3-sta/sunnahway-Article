<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 300px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Layout */
        .sidebar {
            width: var(--sidebar-width);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            border-right: 1px solid var(--bs-border-color);
            background: var(--bs-body-bg);
            z-index: 1000;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: 100vh;
        }

        /* Model Selector (Minimalist) */
        .model-selector {
            border: none;
            background: transparent;
            font-weight: 500;
            color: var(--bs-body-color);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .model-selector:hover {
            opacity: 1;
        }

        .model-selector:focus {
            outline: none;
        }

        /* Themes */
        [data-theme="forest"] {
            --bs-body-bg: #f0fdf4;
            --bs-body-color: #14532d;
            --bs-primary: #15803d;
            --bs-border-color: #bbf7d0;
        }

        [data-theme="midnight"] {
            --bs-body-bg: #0f172a;
            --bs-body-color: #e2e8f0;
            --bs-primary: #38bdf8;
            --bs-border-color: #1e293b;
        }

        /* Dark mode overrides for bootstrap components */
        [data-bs-theme="dark"] .list-group-item-action:hover {
            background-color: #2b3035;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar p-3 d-flex flex-column">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-book-half me-2"></i>SunnahWay</h5>
            <div class="dropdown">
                <button class="btn btn-link text-reset p-0" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <h6 class="dropdown-header" data-i18n="theme">Theme</h6>
                    </li>
                    <li><button class="dropdown-item" onclick="setTheme('light')">☀️ Light</button></li>
                    <li><button class="dropdown-item" onclick="setTheme('dark')">🌙 Dark</button></li>
                    <li><button class="dropdown-item" onclick="setTheme('forest')">🌿 Forest</button></li>
                    <li><button class="dropdown-item" onclick="setTheme('midnight')">🌌 Midnight</button></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <h6 class="dropdown-header" data-i18n="language">Language</h6>
                    </li>
                    <li><button class="dropdown-item" onclick="setLang('en')">🇺🇸 English</button></li>
                    <li><button class="dropdown-item" onclick="setLang('bn')">🇧🇩 বাংলা</button></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><button class="dropdown-item" onclick="openSettings()"><i class="bi bi-gear me-2"></i> <span
                                data-i18n="settings">Settings</span></button></li>
                </ul>
            </div>
        </div>

        <div class="mb-3">
            <select id="category" class="form-select" onchange="loadArticles()">
                <option value="seerah">Seerah (সীরাত)</option>
                <option value="aqeedah">Aqeedah (আকিদাহ)</option>
                <option value="fiqh">Fiqh (ফিকহ)</option>
                <option value="hadith">Hadith (হাদিস)</option>
                <option value="tafseer">Tafseer (তাফসির)</option>
            </select>
        </div>

        <button onclick="createNew()" class="btn btn-primary w-100 mb-3">
            <i class="bi bi-plus-lg me-1"></i> <span data-i18n="new_article">New Article</span>
        </button>

        <div id="articleList" class="list-group list-group-flush flex-grow-1 overflow-auto">
            <!-- Articles will load here -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid p-0">
            <!-- Header Bar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0" data-i18n="editor_title">Editor</h2>

                <!-- Model Selector Dropdown -->
                <div class="dropdown">
                    <button class="model-selector dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-stars text-warning"></i>
                        <span id="currentModelName">Gemini 1.5 Flash</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" id="modelList">
                        <!-- Models injected via JS -->
                    </ul>
                </div>
            </div>

            <input type="hidden" id="articleId">

            <!-- Title Inputs -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="titleBn" class="form-control" placeholder="Title">
                        <label>Title (Bangla)</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="titleEn" class="form-control" placeholder="Title">
                        <label>Title (English)</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-floating">
                        <input type="text" id="titleAr" class="form-control" placeholder="Title" dir="rtl">
                        <label>Title (Arabic)</label>
                    </div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="card mb-3 shadow-sm">
                <div class="card-header bg-transparent d-flex flex-wrap gap-2 align-items-center py-2">
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary" onclick="insertFormat('**', '**')" title="Bold"><i
                                class="bi bi-type-bold"></i></button>
                        <button class="btn btn-outline-secondary" onclick="insertFormat('*', '*')" title="Italic"><i
                                class="bi bi-type-italic"></i></button>
                        <button class="btn btn-outline-secondary" onclick="insertFormat('## ', '')" title="Heading"><i
                                class="bi bi-type-h2"></i></button>
                        <button class="btn btn-outline-secondary" onclick="insertFormat('\n- ', '')" title="List"><i
                                class="bi bi-list-ul"></i></button>
                    </div>

                    <div class="vr mx-2"></div>

                    <button class="btn btn-sm btn-outline-primary border-0" onclick="openAIGenerator()">
                        <i class="bi bi-magic me-1"></i> <span data-i18n="generate_ai">Generate with AI</span>
                    </button>
                    <button class="btn btn-sm btn-outline-info border-0" onclick="autoTranslate()">
                        <i class="bi bi-translate me-1"></i> <span data-i18n="translate">Translate</span>
                    </button>
                </div>

                <div class="card-body p-0">
                    <!-- Tabs -->
                    <ul class="nav nav-tabs nav-fill border-0" id="langTabs" role="tablist">
                        <li class="nav-item"><button class="nav-link active rounded-0 border-top-0 border-start-0"
                                id="bn-tab" data-bs-toggle="tab" data-bs-target="#bn-content">🇧🇩 Bangla</button></li>
                        <li class="nav-item"><button class="nav-link rounded-0 border-top-0" id="en-tab"
                                data-bs-toggle="tab" data-bs-target="#en-content">🇺🇸 English</button></li>
                        <li class="nav-item"><button class="nav-link rounded-0 border-top-0 border-end-0" id="ar-tab"
                                data-bs-toggle="tab" data-bs-target="#ar-content">🇸🇦 Arabic</button></li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="bn-content">
                            <textarea id="contentBn" class="form-control border-0 rounded-0 p-3" rows="15"
                                placeholder="Write content here..."></textarea>
                        </div>
                        <div class="tab-pane fade" id="en-content">
                            <textarea id="contentEn" class="form-control border-0 rounded-0 p-3" rows="15"
                                placeholder="Write content here..."></textarea>
                        </div>
                        <div class="tab-pane fade" id="ar-content">
                            <textarea id="contentAr" class="form-control border-0 rounded-0 p-3" rows="15"
                                placeholder="Write content here..." dir="rtl"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2 justify-content-end">
                <button onclick="publishArticle()" class="btn btn-success px-4">
                    <i class="bi bi-cloud-upload me-2"></i><span data-i18n="save_publish">Save & Publish</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="api_settings">API Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Gemini API Key</label>
                        <input type="password" id="geminiKey" class="form-control" placeholder="AIzaSy...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">OpenAI API Key (GPT)</label>
                        <input type="password" id="openaiKey" class="form-control" placeholder="sk-...">
                    </div>
                    <div class="alert alert-info small">
                        Keys are stored locally in your browser.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveSettings()"
                        data-i18n="save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // --- Configuration & State ---
        const translations = {
            en: {
                theme: "Theme", language: "Language", settings: "Settings", new_article: "New Article",
                editor_title: "Editor", generate_ai: "Generate with AI", translate: "Translate",
                save_publish: "Save & Publish", api_settings: "API Settings", save: "Save"
            },
            bn: {
                theme: "থিম", language: "ভাষা", settings: "সেটিংস", new_article: "নতুন আর্টিকেল",
                editor_title: "এডিটর", generate_ai: "AI দিয়ে লিখুন", translate: "অনুবাদ করুন",
                save_publish: "সেভ ও পাবলিশ", api_settings: "API সেটিংস", save: "সংরক্ষণ"
            }
        };

        const models = [
            { id: 'gemini-flash', name: 'Gemini 1.5 Flash', provider: 'gemini' },
            { id: 'gemini-pro', name: 'Gemini 1.5 Pro', provider: 'gemini' },
            { id: 'gpt-4o', name: 'GPT-4o', provider: 'openai' },
            { id: 'gpt-4o-mini', name: 'GPT-4o Mini', provider: 'openai' }
        ];

        let currentLang = localStorage.getItem('app_lang') || 'en';
        let currentTheme = localStorage.getItem('app_theme') || 'light';
        let currentModel = localStorage.getItem('selected_model') || 'gemini-flash';

        // --- Initialization ---
        window.onload = () => {
            loadArticles();
            setTheme(currentTheme);
            setLang(currentLang);
            initModelSelector();
            loadSettings();
        };

        // --- UI Logic ---
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', (theme === 'dark' || theme === 'midnight') ? 'dark' : 'light');
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
        }

        function initModelSelector() {
            const list = document.getElementById('modelList');
            list.innerHTML = '';
            models.forEach(model => {
                const li = document.createElement('li');
                li.innerHTML = `<button class="dropdown-item ${currentModel === model.id ? 'active' : ''}" onclick="selectModel('${model.id}')">${model.name}</button>`;
                list.appendChild(li);
            });
            updateModelLabel();
        }

        function selectModel(id) {
            currentModel = id;
            localStorage.setItem('selected_model', id);
            initModelSelector(); // Re-render to update active state
        }

        function updateModelLabel() {
            const model = models.find(m => m.id === currentModel);
            document.getElementById('currentModelName').innerText = model ? model.name : 'Select Model';
        }

        function openSettings() {
            const modal = new bootstrap.Modal(document.getElementById('settingsModal'));
            modal.show();
        }

        function loadSettings() {
            document.getElementById('geminiKey').value = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('openaiKey').value = localStorage.getItem('openai_api_key') || '';
        }

        function saveSettings() {
            localStorage.setItem('gemini_api_key', document.getElementById('geminiKey').value);
            localStorage.setItem('openai_api_key', document.getElementById('openaiKey').value);
            bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
            Swal.fire({ icon: 'success', title: 'Saved', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        }

        // --- Core Functions ---
        async function loadArticles() {
            const category = document.getElementById('category').value;
            const listDiv = document.getElementById('articleList');
            listDiv.innerHTML = '<div class="text-center text-muted mt-3"><div class="spinner-border spinner-border-sm"></div> Loading...</div>';

            try {
                const res = await fetch(`/api/articles/${category}`);
                const articles = await res.json();

                listDiv.innerHTML = '';
                if (articles.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-muted mt-3">No articles found</div>';
                    return;
                }

                articles.forEach(article => {
                    const item = document.createElement('button');
                    item.className = 'list-group-item list-group-item-action border-0 border-bottom';
                    item.innerHTML = `
                        <div class="fw-bold text-truncate">${article.titleBn || 'No Title'}</div>
                        <small class="text-muted text-truncate d-block">${article.titleEn || 'No English Title'}</small>
                    `;
                    item.onclick = () => loadEditor(article);
                    listDiv.appendChild(item);
                });
            } catch (e) {
                listDiv.innerHTML = '<div class="text-danger text-center mt-3">Failed to load</div>';
            }
        }

        function loadEditor(article) {
            document.getElementById('articleId').value = article.id;
            document.getElementById('titleBn').value = article.titleBn || '';
            document.getElementById('titleEn').value = article.titleEn || '';
            document.getElementById('titleAr').value = article.titleAr || '';
            document.getElementById('contentBn').value = article.contentBn || '';
            document.getElementById('contentEn').value = article.contentEn || '';
            document.getElementById('contentAr').value = article.contentAr || '';
        }

        function createNew() {
            document.getElementById('articleId').value = '';
            ['titleBn', 'titleEn', 'titleAr', 'contentBn', 'contentEn', 'contentAr'].forEach(id => document.getElementById(id).value = '');
            Swal.fire({ icon: 'info', title: 'New Article Mode', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        }

        function getActiveTextarea() {
            if (document.getElementById('bn-tab').classList.contains('active')) return document.getElementById('contentBn');
            if (document.getElementById('en-tab').classList.contains('active')) return document.getElementById('contentEn');
            if (document.getElementById('ar-tab').classList.contains('active')) return document.getElementById('contentAr');
            return document.getElementById('contentBn');
        }

        function insertFormat(start, end) {
            const textarea = getActiveTextarea();
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const text = textarea.value;
            const newText = text.substring(0, startPos) + start + text.substring(startPos, endPos) + end + text.substring(endPos);
            textarea.value = newText;
            textarea.focus();
            textarea.selectionStart = startPos + start.length;
            textarea.selectionEnd = endPos + start.length;
        }

        // --- AI Generation Logic ---
        async function openAIGenerator() {
            const { value: topic } = await Swal.fire({
                title: '✨ AI Magic Generator',
                input: 'text',
                inputLabel: `Using: ${models.find(m => m.id === currentModel).name}`,
                inputPlaceholder: 'Enter topic (e.g. Importance of Salah)',
                showCancelButton: true,
                confirmButtonText: 'Generate'
            });

            if (topic) generateContent(topic);
        }

        async function generateContent(topic) {
            const model = models.find(m => m.id === currentModel);
            let apiKey = localStorage.getItem(`${model.provider}_api_key`);

            if (!apiKey) {
                Swal.fire('Missing Key', `Please add your ${model.provider.toUpperCase()} API Key in Settings.`, 'warning');
                openSettings();
                return;
            }

            Swal.fire({ title: 'Generating...', text: `Using ${model.name}`, allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const prompt = `
                You are an expert Islamic scholar. Write an article about: "${topic}".
                Return ONLY a raw JSON object with this structure:
                {
                    "titleBn": "Bangla Title", "titleEn": "English Title", "titleAr": "Arabic Title",
                    "contentBn": "Bangla Content (Markdown)", "contentEn": "English Content (Markdown)", "contentAr": "Arabic Content (Markdown)"
                }
            `;

            try {
                let result;
                if (model.provider === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.id.includes('pro') ? 'gemini-1.5-pro' : 'gemini-1.5-flash'}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    let text = data.candidates[0].content.parts[0].text;
                    result = JSON.parse(text.replace(/```json/g, '').replace(/```/g, '').trim());
                } else if (model.provider === 'openai') {
                    const res = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: model.id,
                            messages: [{ role: 'user', content: prompt }],
                            response_format: { type: "json_object" }
                        })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    result = JSON.parse(data.choices[0].message.content);
                }

                // Populate fields
                document.getElementById('titleBn').value = result.titleBn;
                document.getElementById('titleEn').value = result.titleEn;
                document.getElementById('titleAr').value = result.titleAr;
                document.getElementById('contentBn').value = result.contentBn;
                document.getElementById('contentEn').value = result.contentEn;
                document.getElementById('contentAr').value = result.contentAr;

                Swal.fire('Success', 'Content generated!', 'success');

            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        }

        async function autoTranslate() {
            // Keeping existing simple translation logic for now
            const textBn = document.getElementById('contentBn').value;
            if (!textBn) return Swal.fire('Empty', 'Write in Bangla first', 'warning');

            Swal.fire({ title: 'Translating...', didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textBn.substring(0, 500))}&langpair=bn|en`);
                const data = await res.json();
                document.getElementById('contentEn').value = data.responseData.translatedText;
                Swal.close();
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        async function publishArticle() {
            const category = document.getElementById('category').value;
            const id = document.getElementById('articleId').value || `${category}-${Date.now()}`;
            const article = {
                id, categoryId: category,
                titleBn: document.getElementById('titleBn').value,
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                contentBn: document.getElementById('contentBn').value,
                contentEn: document.getElementById('contentEn').value,
                contentAr: document.getElementById('contentAr').value
            };

            if (!article.titleBn || !article.contentBn) return Swal.fire('Error', 'Title & Content required', 'error');

            Swal.fire({ title: 'Saving...', didOpen: () => Swal.showLoading() });

            try {
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, article })
                });
                await fetch('/api/push', { method: 'POST' });

                Swal.fire('Published!', 'Saved to GitHub', 'success');
                loadArticles();
            } catch (e) {
                Swal.fire('Failed', e.message, 'error');
            }
        }
    </script>
</body>

</html>
