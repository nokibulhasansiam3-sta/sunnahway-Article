<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnahWay Article Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .preview {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .btn-toolbar {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- Bootstrap JS for Tabs -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar: Article List -->
            <div class="col-md-3 bg-white p-3 border-end" style="min-height: 100vh;">
                <h4 class="text-center mb-3">Articles</h4>

                <div class="mb-3">
                    <select id="category" class="form-select" onchange="loadArticles()">
                        <option value="seerah">Seerah (সীরাত)</option>
                        <option value="aqeedah">Aqeedah (আকিদাহ)</option>
                        <option value="fiqh">Fiqh (ফিকহ)</option>
                        <option value="hadith">Hadith (হাদিস)</option>
                        <option value="tafseer">Tafseer (তাফসির)</option>
                    </select>
                </div>

                <button onclick="createNew()" class="btn btn-success w-100 mb-3">+ New Article</button>

                <div id="articleList" class="list-group">
                    <!-- Articles will load here -->
                </div>
            </div>

            <!-- Main: Editor -->
            <div class="col-md-9 p-4">
                <h2 class="text-center mb-4">SunnahWay Editor</h2>

                <input type="hidden" id="articleId"> <!-- Hidden ID for updates -->

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Title (Bangla)</label>
                        <input type="text" id="titleBn" class="form-control" placeholder="বাংলা শিরোনাম">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Title (English)</label>
                        <input type="text" id="titleEn" class="form-control" placeholder="English Title">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Title (Arabic)</label>
                        <input type="text" id="titleAr" class="form-control" placeholder="العنوان العربي" dir="rtl">
                    </div>
                </div>

                <!-- Formatting Toolbar -->
                <div class="btn-toolbar mb-2" role="toolbar">
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="insertFormat('**', '**')"><b>Bold</b></button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="insertFormat('*', '*')"><i>Italic</i></button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="insertFormat('## ', '')">Heading</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="insertFormat('\n- ', '')">List</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="insertFormat('\n\n', '')">New Para</button>
                    </div>
                    <button type="button" class="btn btn-info btn-sm text-white ms-auto" onclick="autoTranslate()">✨
                        Auto Translate (from Bangla)</button>
                </div>

                <!-- Language Tabs -->
                <ul class="nav nav-tabs mb-3" id="langTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="bn-tab" data-bs-toggle="tab" data-bs-target="#bn-content"
                            type="button">Bangla</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="en-tab" data-bs-toggle="tab" data-bs-target="#en-content"
                            type="button">English</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="ar-tab" data-bs-toggle="tab" data-bs-target="#ar-content"
                            type="button">Arabic</button>
                    </li>
                </ul>

                <div class="tab-content" id="langTabContent">
                    <!-- Bangla -->
                    <div class="tab-pane fade show active" id="bn-content" role="tabpanel">
                        <textarea id="contentBn" class="form-control" rows="15"
                            placeholder="বাংলায় লিখুন..."></textarea>
                    </div>
                    <!-- English -->
                    <div class="tab-pane fade" id="en-content" role="tabpanel">
                        <textarea id="contentEn" class="form-control" rows="15"
                            placeholder="Write in English..."></textarea>
                    </div>
                    <!-- Arabic -->
                    <div class="tab-pane fade" id="ar-content" role="tabpanel">
                        <textarea id="contentAr" class="form-control" rows="15" placeholder="اكتب بالعربية..."
                            dir="rtl"></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button onclick="publishArticle()" class="btn btn-primary flex-grow-1">💾 Save & Publish</button>
                </div>
                <div id="status" class="mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Load articles on start
        window.onload = loadArticles;

        async function loadArticles() {
            const category = document.getElementById('category').value;
            const listDiv = document.getElementById('articleList');
            listDiv.innerHTML = '<div class="text-center text-muted mt-3">Loading...</div>';

            try {
                const res = await fetch(`/api/articles/${category}`);
                const articles = await res.json();

                listDiv.innerHTML = '';
                if (articles.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-muted mt-3">No articles found</div>';
                    return;
                }

                articles.forEach(article => {
                    const item = document.createElement('a');
                    item.className = 'list-group-item list-group-item-action';
                    item.style.cursor = 'pointer';
                    item.innerHTML = `
                    <div class="fw-bold">${article.titleBn || 'No Title'}</div>
                    <small class="text-muted">${article.titleEn || ''}</small>
                `;
                    item.onclick = (event) => loadEditor(article, event);
                    listDiv.appendChild(item);
                });
            } catch (e) {
                listDiv.innerHTML = '<div class="text-danger text-center mt-3">Failed to load</div>';
            }
        }

        function loadEditor(article, event) {
            document.getElementById('articleId').value = article.id;
            document.getElementById('titleBn').value = article.titleBn || '';
            document.getElementById('titleEn').value = article.titleEn || '';
            document.getElementById('titleAr').value = article.titleAr || '';

            document.getElementById('contentBn').value = article.contentBn || '';
            document.getElementById('contentEn').value = article.contentEn || '';
            document.getElementById('contentAr').value = article.contentAr || '';

            // Highlight selected
            document.querySelectorAll('.list-group-item').forEach(el => el.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function createNew() {
            document.getElementById('articleId').value = '';
            document.getElementById('titleBn').value = '';
            document.getElementById('titleEn').value = '';
            document.getElementById('titleAr').value = '';

            document.getElementById('contentBn').value = '';
            document.getElementById('contentEn').value = '';
            document.getElementById('contentAr').value = '';

            document.querySelectorAll('.list-group-item').forEach(el => el.classList.remove('active'));

            Swal.fire({
                icon: 'info',
                title: 'New Article Mode',
                text: 'Fill the form to create a new article',
                timer: 1500,
                showConfirmButton: false
            });
        }

        function getActiveTextarea() {
            if (document.getElementById('bn-tab').classList.contains('active')) return document.getElementById('contentBn');
            if (document.getElementById('en-tab').classList.contains('active')) return document.getElementById('contentEn');
            if (document.getElementById('ar-tab').classList.contains('active')) return document.getElementById('contentAr');
            return document.getElementById('contentBn'); // Default
        }

        function insertFormat(start, end) {
            const textarea = getActiveTextarea();
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const text = textarea.value;
            const selectedText = text.substring(startPos, endPos);

            const newText = text.substring(0, startPos) + start + selectedText + end + text.substring(endPos);
            textarea.value = newText;
            textarea.focus();
            textarea.selectionStart = startPos + start.length;
            textarea.selectionEnd = endPos + start.length;
        }

        async function autoTranslate() {
            const textBn = document.getElementById('contentBn').value;
            const titleBn = document.getElementById('titleBn').value;

            if (!textBn) {
                Swal.fire('Empty', 'Please write something in Bangla first.', 'warning');
                return;
            }

            Swal.fire({
                title: 'Translating...',
                text: 'Fetching translations for English and Arabic...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                // Translate Title
                if (titleBn) {
                    const titleEnRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(titleBn)}&langpair=bn|en`);
                    const titleEnData = await titleEnRes.json();
                    document.getElementById('titleEn').value = titleEnData.responseData.translatedText;

                    const titleArRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(titleBn)}&langpair=bn|ar`);
                    const titleArData = await titleArRes.json();
                    document.getElementById('titleAr').value = titleArData.responseData.translatedText;
                }

                // Translate Content (Chunking might be needed for large texts, but keeping simple for now)
                // MyMemory has a limit of 500 chars per request for free. We'll try best effort.
                const contentEnRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textBn.substring(0, 500))}&langpair=bn|en`);
                const contentEnData = await contentEnRes.json();
                document.getElementById('contentEn').value = contentEnData.responseData.translatedText + (textBn.length > 500 ? '... (Translation limit reached)' : '');

                const contentArRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textBn.substring(0, 500))}&langpair=bn|ar`);
                const contentArData = await contentArRes.json();
                document.getElementById('contentAr').value = contentArData.responseData.translatedText + (textBn.length > 500 ? '... (Translation limit reached)' : '');

                Swal.fire('Done', 'Translation completed! Please review and edit.', 'success');

            } catch (e) {
                Swal.fire('Error', 'Translation failed: ' + e.message, 'error');
            }
        }

        async function publishArticle() {
            const category = document.getElementById('category').value;
            const id = document.getElementById('articleId').value;
            const titleBn = document.getElementById('titleBn').value;
            const titleEn = document.getElementById('titleEn').value;
            const titleAr = document.getElementById('titleAr').value;

            const contentBn = document.getElementById('contentBn').value;
            const contentEn = document.getElementById('contentEn').value;
            const contentAr = document.getElementById('contentAr').value;

            if (!titleBn || !contentBn) {
                Swal.fire('Error', 'Please fill at least Bangla Title and Content', 'error');
                return;
            }

            // Show loading
            Swal.fire({
                title: 'Saving...',
                text: 'Please wait while we save and push to GitHub',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            const article = {
                id: id || `${category}-${Date.now()}`,
                categoryId: category,
                titleBn, titleEn, titleAr,
                contentBn, contentEn, contentAr
            };

            try {
                // 1. Save Locally
                const saveRes = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, article })
                });
                const saveData = await saveRes.json();

                if (!saveData.success) throw new Error(saveData.message);

                // 2. Push to GitHub
                const pushRes = await fetch('/api/push', { method: 'POST' });
                const pushData = await pushRes.json();

                if (!pushData.success) throw new Error(pushData.message);

                // Success Message
                Swal.fire({
                    icon: 'success',
                    title: 'Published!',
                    text: 'Article has been saved and pushed to GitHub.',
                    confirmButtonColor: '#28a745'
                });

                // Reload list
                loadArticles();

            } catch (error) {
                Swal.fire('Failed', error.message, 'error');
                console.error(error);
            }
        }
    </script>
</body>

</html>
